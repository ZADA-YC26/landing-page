<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAD — Your Dare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05030A;
    --surface: #130F20;
    --surface-2: #1B1530;
    --cyan: #00E5FF;
    --violet: #9D00FF;
    --lime: #CCFF00;
    --white: #F5F0E8;
    --muted: #9B95AF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 90% at 50% -10%, #170F2A 0%, var(--bg) 55%);
    color: var(--white);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .brand {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.04em;
    color: var(--white); opacity: 0.85; font-size: 14px;
  }
  .brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); }

  .card {
    width: 100%; max-width: 420px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border-radius: 28px;
    padding: 40px 28px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset;
    text-align: center;
    opacity: 0; transform: translateY(14px) scale(0.98);
    animation: rise 0.55s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0) scale(1); } }

  .kicker {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan);
    margin: 0 0 14px;
  }
  .dare-text {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 26px; line-height: 1.28; color: var(--white);
    margin: 0 0 32px; min-height: 100px;
    display: flex; align-items: center; justify-content: center;
  }

  .ring-wrap { position: relative; width: 176px; height: 176px; margin: 0 auto 28px; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .ring-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 8; }
  .ring-progress { fill: none; stroke: url(#ringGrad); stroke-width: 8; stroke-linecap: round;
    transition: stroke-dashoffset 1s linear; }
  .sweep {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(204,255,0,0.35), rgba(204,255,0,0) 22%);
    animation: spin 3.2s linear infinite;
    -webkit-mask: radial-gradient(circle, transparent 62%, black 63%);
            mask: radial-gradient(circle, transparent 62%, black 63%);
    opacity: 0.9;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ring-number {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px; color: var(--white);
    transition: color 0.3s ease;
  }
  .ring-number.urgent { color: var(--violet); }

  .hint { font-size: 13px; color: var(--muted); margin: 0 0 22px; }

  .submit-btn {
    appearance: none; border: none; cursor: pointer;
    width: 100%; padding: 16px 20px; border-radius: 16px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px;
    color: var(--bg); background: linear-gradient(90deg, var(--cyan), #6FF0FF);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,229,255,0.25); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

  .footnote { margin-top: 18px; font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; transform: none; }
    .sweep { animation: none; opacity: 0.5; }
    .ring-progress { transition: none; }
  }
</style>
</head>
<body>
  <div class="brand" aria-hidden="true"><span class="dot"></span>ZAD</div>

  <main class="card">
    <p class="kicker">Your Dare</p>
    <h1 class="dare-text" id="dareText">Loading your dare&hellip;</h1>

    <div class="ring-wrap" aria-hidden="true">
      <div class="sweep"></div>
      <svg width="176" height="176" viewBox="0 0 176 176">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="100%" stop-color="#9D00FF"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="88" cy="88" r="80"/>
        <circle class="ring-progress" id="ringProgress" cx="88" cy="88" r="80"/>
      </svg>
      <div class="ring-number" id="ringNumber">30</div>
    </div>

    <p class="hint">One live photo. No camera roll. No planning.</p>

    <button class="submit-btn" id="submitBtn">I did it — submit proof</button>
    <p class="footnote">Redirecting automatically when time's up.</p>
  </main>

<script>
  // ---- Swap these 8 for your real finalized dares (id = url-safe slug) ----
  const DARES = [
    { id: "skyline-pose",    text: "Find the tallest thing in view. Strike your best hero pose in front of it." },
    { id: "unknown-snack",   text: "Track down a snack you've never tried before. Photo, before the first bite." },
    { id: "mystery-sign",    text: "Find a sign with a word you don't understand. Photo of you pointing at it." },
    { id: "tourist-bench",   text: "Find a bench. Sit like you own the city. Take a proud, unbothered selfie." },
    { id: "old-thing",       text: "Find something older than your home country. Photo of your shoe next to it." },
    { id: "sky-check",       text: "Point straight up and take the photo. Bonus points if something's actually up there." },
    { id: "reflection-hunt", text: "Find the most unexpected reflective surface nearby. Mirror selfie, right there." },
    { id: "highest-point",   text: "Get to the highest point you can reach in 30 seconds. Photograph the view." },
  ];

  const TALLY_URL = "https://tally.so/r/D4M5PR";
  const DURATION = 30;

  const dare = DARES[Math.floor(Math.random() * DARES.length)];
  document.getElementById("dareText").textContent = dare.text;

  const redirectUrl = TALLY_URL + "?dare=" + encodeURIComponent(dare.id);
  document.getElementById("submitBtn").addEventListener("click", function () {
    window.location.href = redirectUrl;
  });

  const RADIUS = 80;
  const CIRC = 2 * Math.PI * RADIUS;
  const ringProgress = document.getElementById("ringProgress");
  const ringNumber = document.getElementById("ringNumber");
  ringProgress.style.strokeDasharray = CIRC.toFixed(1);

  let remaining = DURATION;
  let timer;
  function tick() {
    const pct = remaining / DURATION;
    ringProgress.style.strokeDashoffset = (CIRC * (1 - pct)).toFixed(1);
    ringNumber.textContent = remaining;
    ringNumber.classList.toggle("urgent", remaining <= 5);
    if (remaining <= 0) {
      clearInterval(timer);
      window.location.href = redirectUrl;
      return;
    }
    remaining -= 1;
  }
  tick();
  timer = setInterval(tick, 1000);
</script>
</body>
</html>
